<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteveChat</title>
    <link rel="icon" href="images/icon.jpg" type="image/jpeg">
    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "@google/generative-ai":"https://esm.run/@google/generative-ai"
            }
        }
    </script>
</head>
<body class="overflow-hidden">

    <audio id="audioPlayer" >
        <source src="sounds/Aerie.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

    <main id="parallax-container">
        <img src="images/Layer9.png" alt="" class="parallax-layer">
        <img src="images/Layer8.png" alt="" class="parallax-layer">
        <img src="images/Layer7.png" alt="" class="parallax-layer">
        <img src="images/Layer6.png" alt="" class="parallax-layer">
        <img src="images/Layer5.png" alt="" class="parallax-layer">
        <img src="images/Layer4.png" alt="" class="parallax-layer">
        <img src="images/Layer3.png" alt="" class="parallax-layer">
        <img src="images/steve-off.png" id="steve-button" alt="" class="parallax-layer">

        <section id="steve" aria-label="SteveChat">
        
            <div class="sample-questions">
                <div class="hover:bg-gray-900/50 hover:text-white cursor-pointer px-2 transition-all duration-100 question">How do we find diamonds?</div>
                <div class="hover:bg-gray-900/50 hover:text-white cursor-pointer px-2 transition-all duration-100 question">Who is Herobrine?</div>
                <div class="hover:bg-gray-900/50 hover:text-white cursor-pointer px-2 transition-all duration-100 question">Who are you?</div>
                <div class="hover:bg-gray-900/50 hover:text-white cursor-pointer px-2 transition-all duration-100 question">Creeper? Aww man.</div>
                <div class="hover:bg-gray-900/50 hover:text-white cursor-pointer px-2 transition-all duration-100 question">Where can you find the Mushroom biome?</div>
                <div class="hover:bg-gray-900/50 hover:text-white cursor-pointer px-2 transition-all duration-100 question">List all available ores.</div>
                <div class="hover:bg-gray-900/50 hover:text-white cursor-pointer px-2 transition-all duration-100 question">What is your story?</div>
            </section>
            

            <div class="chat">
                <div class="chatbot-container pb-20">
                    
                </div>
            </div>

            <div class="typing">
                
                <textarea rows="1" placeholder="Type your message..." id="chat-input" spellcheck="false"></textarea>

                <button id="send-btn">
                    Send
                </button>
            </div>
        </div>

        
        <img src="images/Layer2.png" alt="" class="parallax-layer">
        <img src="images/Layer1.png" alt="" class="parallax-layer">

    </main>

    <!-- Brain -->
    <script type="module" src="mainmodule.js"></script>

    <!-- Calls for command -->
    <script type="module" src="script.js"></script>
</body>
</html>
